<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fábrica Hotel — Vista móvil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(120% 80% at 50% 0%, #2a2723 0%, #14110D 55%, #0c0a07 100%);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 48px 20px 56px;
      color: #fff;
    }
    .intro { text-align: center; max-width: 520px; }
    .intro .eyebrow {
      font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
      color: #E8601A; margin-bottom: 14px;
    }
    .intro h1 {
      font-family: 'Playfair Display', serif; font-weight: 500;
      font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.05; margin: 0 0 12px;
    }
    .intro p { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.55); margin: 0; }
    .stage { display: flex; justify-content: center; }
    #root { display: flex; justify-content: center; }
    .hint {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); display: flex; align-items: center; gap: 8px;
    }
    .hint .dot { width: 6px; height: 6px; border-radius: 50%; background: #E8601A; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="intro">
    <div class="eyebrow">★ ★ ★ ★ · Vista móvil</div>
    <h1>Fábrica Hotel en tu teléfono</h1>
    <p>La misma landing, adaptada a pantalla de teléfono. Deslizá dentro del equipo para recorrerla — el menú, el video del hero, las habitaciones y la historia funcionan igual que en escritorio.</p>
  </div>

  <div class="stage">
    <div id="root"></div>
  </div>

  <div class="hint"><span class="dot"></span> Deslizá dentro del iPhone</div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel">
    const PHONE_W = 390;
    const PHONE_H = 800;

    function MobilePreview() {
      return (
        <IOSDevice width={PHONE_W} height={PHONE_H} dark>
          <div style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100%', background: '#14110D' }}>
            <div style={{ height: 50, flexShrink: 0, background: '#14110D' }} />
            <iframe
              src="index.html"
              title="Fábrica Hotel móvil"
              style={{
                width: '100%', flex: 1, border: 0, display: 'block',
                background: '#14110D',
              }}
            />
          </div>
        </IOSDevice>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MobilePreview />);
  </script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#14110D" />
      <rect x="38" y="20" width="24" height="60" rx="5" fill="none" stroke="#E8601A" stroke-width="2.5" />
      <text x="50" y="54" font-family="Georgia, serif" font-size="7" fill="#fff" text-anchor="middle">fábrica</text>
      <text x="50" y="63" font-family="Georgia, serif" font-size="7" fill="#E8601A" text-anchor="middle">hotel</text>
    </svg>
  </template>
</body>
</html>
